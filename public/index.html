<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login · Patitas al poder</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <h1>Patitas al poder</h1>
      <p class="muted">Ingreso para veterinario y asistente</p>
      <div id="alert"></div>
      <form id="loginForm">
        <div class="form-row">
          <label for="email">Correo</label>
          <input id="email" type="email" required placeholder="vet@chavezpets.bo" autocomplete="username" />
        </div>
        <div class="form-row">
          <label for="password">Contraseña</label>
          <input id="password" type="password" required autocomplete="current-password" />
        </div>
        <button class="btn" type="submit" style="width:100%">Entrar</button>
      </form>
      <p class="muted" style="margin-top:1rem;font-size:0.82rem">
        Seeds: <code>vet@chavezpets.bo</code> / <code>Vet123!</code> ·
        <code>asistente@chavezpets.bo</code> / <code>Asist123!</code>
      </p>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script>
    if (API.getToken()) {
      window.location.href = '/pages/dashboard.html';
    }
    const alertEl = document.getElementById('alert');
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      alertEl.innerHTML = '';
      try {
        const data = await API.request('/api/auth/login', {
          method: 'POST',
          body: {
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value,
          },
        });
        API.setSession(data.token, data.user);
        window.location.href = '/pages/dashboard.html';
      } catch (err) {
        alertEl.innerHTML = `<div class="alert error">${err.message}</div>`;
      }
    });
  </script>
</body>
</html>
