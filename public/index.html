<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Patitas al poder · Registro y control de atención veterinaria</title>
  <link rel="icon" type="image/jpeg" href="/img/logo.jpg" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card" style="text-align: center;">
      <div style="margin-bottom: 1rem;">
        <img src="/img/logo.jpg" alt="Logo Patitas al poder" style="width: 130px; height: 130px; border-radius: 50%; object-fit: cover; box-shadow: 0 6px 18px rgba(0,0,0,0.18); border: 3px solid #fff;" />
      </div>
      <h1 style="margin: 0; font-size: 1.6rem; color: var(--brand-dark);">Patitas al poder</h1>
      <p class="muted" style="margin: 0.35rem 0 1.25rem; font-size: 0.92rem;">Registro y control de atención veterinaria</p>
      <div id="alert"></div>
      <form id="loginForm" style="text-align: left;">
        <div class="form-row">
          <label for="email">Correo electrónico</label>
          <input id="email" type="email" required placeholder="vet@chavezpets.bo" autocomplete="username" />
        </div>
        <div class="form-row">
          <label for="password">Contraseña</label>
          <input id="password" type="password" required autocomplete="current-password" />
        </div>
        <button class="btn" type="submit" style="width:100%; margin-top: 0.5rem;">Iniciar sesión</button>
      </form>
      <p class="muted" style="margin-top:1.25rem;font-size:0.82rem; border-top: 1px solid var(--line); padding-top: 0.75rem;">
        Accesos de prueba: <code>vet@chavezpets.bo</code> / <code>Vet123!</code> ·
        <code>asistente@chavezpets.bo</code> / <code>Asist123!</code>
      </p>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script>
    if (API.getToken()) {
      window.location.href = '/pages/dashboard.html';
    }
    const alertEl = document.getElementById('alert');
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      alertEl.innerHTML = '';
      try {
        const data = await API.request('/api/auth/login', {
          method: 'POST',
          body: {
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value,
          },
        });
        API.setSession(data.token, data.user);
        window.location.href = '/pages/dashboard.html';
      } catch (err) {
        alertEl.innerHTML = `<div class="alert error">${err.message}</div>`;
      }
    });
  </script>
</body>
</html>
